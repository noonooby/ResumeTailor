<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeCreator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff">
    
    <!-- iOS specific tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ResumeCreator">
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
      /* Prevent iOS auto-zoom on inputs */
      input, textarea, select {
        font-size: 16px !important;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8f9fa;
        transition: background-color 0.3s;
      }
      
      /* Dark Mode Global Filter Setup */
      html.dark body {
        background-color: #111827;
      }
      html.dark #app-wrapper {
        filter: invert(1) hue-rotate(180deg);
      }
      /* Revert specific elements so they display correctly */
      html.dark img, 
      html.dark svg,
      html.dark #resume-content, 
      html.dark #cl-content,
      html.dark .no-invert {
        filter: invert(1) hue-rotate(180deg);
      }

      /* Print specific styles for the Resume Preview */
      @media print {
        body * {
          visibility: hidden;
        }
        #resume-preview, #resume-preview * {
          visibility: visible;
        }
        #resume-preview {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 0;
          box-shadow: none;
          border: none;
        }
        @page {
          size: auto;
          margin: 0mm;
        }
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <app-root></app-root>
  </body>
</html>
